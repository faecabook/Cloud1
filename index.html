<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>ตัวอย่าง OG GIF Facebook</title>

  <!-- Open Graph สำหรับ Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ตัวอย่าง GIF ทดสอบ OG">
  <meta property="og:description" content="ทดสอบให้ Facebook ดึงรูป GIF แสดงผลเป็น Preview">
  <meta property="og:url" content="https://yourdomain.com/og.html">

  <!-- รูป GIF -->
  <meta property="og:image" content="https://iili.io/KX1KcUG.gif">
  <meta property="og:image:type" content="image/gif">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="315">

  <!-- ป้องกัน cache -->
  <meta http-equiv="cache-control" content="no-cache">
</head>

<body>
  <h1>OG GIF Facebook</h1>
  <p>หน้านี้ใช้สำหรับให้ Facebook ดึง OG Image</p>
</body>
</html>
